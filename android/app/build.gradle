apply plugin: 'com.android.application'

// Signing credentials are read from android/keystore.properties, which is not in
// the repo, or from the environment on a build machine. A clone with neither can
// still build debug and an unsigned release.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String key, String envName, String fallback ->
    keystoreProperties.getProperty(key) ?: System.getenv(envName) ?: fallback
}

def releaseStoreFile = rootProject.file(
        signingValue('storeFile', 'PARLANCE_KEYSTORE_FILE', 'parlance-release.jks'))
def releaseStorePassword = signingValue('storePassword', 'PARLANCE_KEYSTORE_PASSWORD', null)
def releaseKeyAlias = signingValue('keyAlias', 'PARLANCE_KEY_ALIAS', 'parlance')
def releaseKeyPassword = signingValue('keyPassword', 'PARLANCE_KEY_PASSWORD', null)
def canSignRelease = releaseStoreFile.exists() &&
        releaseStorePassword != null &&
        releaseKeyPassword != null

if (!canSignRelease) {
    logger.lifecycle('Parlance: release signing is not configured. Copy ' +
            'android/keystore.properties.example to android/keystore.properties ' +
            'and fill it in before building a release bundle.')
}

android {
    namespace = "com.parlance.interpreterguide"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.parlance.interpreterguide"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in step with Parlance/Info.plist (CFBundleVersion /
        // CFBundleShortVersionString) by scripts/check_platform_sync.py.
        versionCode 39
        versionName "2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    assetPacks = [":parlance_models"]
    packaging {
        resources {
            excludes += [
                "net/ladenthin/llama/Linux/**",
                "net/ladenthin/llama/Linux-Android/**",
                "net/ladenthin/llama/Mac/**",
                "net/ladenthin/llama/Windows/**",
                "META-INF/INDEX.LIST",
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/*.SF",
                "META-INF/*.DSA",
                "META-INF/*.RSA",
            ]
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.jniLibs.srcDirs += ["${layout.buildDirectory.get().asFile}/llama-jni"]
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations {
    llamaNatives
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Native auth. Google refuses OAuth from embedded WebViews, so the Firebase
    // web popup cannot work inside Capacitor — sign-in has to happen in Java.
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation "com.google.firebase:firebase-auth"
    implementation "androidx.credentials:credentials:$androidxCredentialsVersion"
    implementation "androidx.credentials:credentials-play-services-auth:$androidxCredentialsVersion"
    implementation "com.google.android.libraries.identity.googleid:googleid:$googleIdVersion"
    // Java API + Android CPU natives. The llama-android AAR is documented
    // but not on Maven Central; the default llama JAR ships Linux-Android
    // libjllama.so and the same LlamaModel API.
    implementation "net.ladenthin:llama:$llamaAndroidVersion"
    llamaNatives "net.ladenthin:llama:$llamaAndroidVersion"
    implementation "com.google.android.play:asset-delivery:2.3.0"
    implementation "com.android.billingclient:billing:$playBillingVersion"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// LlamaLoader on Android calls System.loadLibrary("jllama"), which only sees
// APK jniLibs. The Maven JAR keeps those .so files as Java resources.
def llamaJniDir = layout.buildDirectory.dir("llama-jni")
tasks.register("extractLlamaNatives") {
    def outputDir = llamaJniDir
    doLast {
        def llamaJar = configurations.llamaNatives.find { file ->
            file.name ==~ /llama-\d.*\.jar/ &&
                    !file.name.contains("sources") &&
                    !file.name.contains("javadoc")
        }
        if (llamaJar == null) {
            throw new GradleException("net.ladenthin:llama jar is not on runtimeClasspath")
        }
        [
                ["net/ladenthin/llama/Linux-Android/aarch64/libjllama.so", "arm64-v8a"],
                ["net/ladenthin/llama/Linux-Android/x86_64/libjllama.so", "x86_64"],
        ].each { entry, abi ->
            copy {
                from(zipTree(llamaJar)) {
                    include entry
                    eachFile { it.path = "libjllama.so" }
                    includeEmptyDirs = false
                }
                into new File(outputDir.get().asFile, abi)
            }
        }
    }
}
tasks.named("preBuild").configure { dependsOn("extractLlamaNatives") }
