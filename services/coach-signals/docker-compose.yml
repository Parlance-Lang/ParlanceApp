# Runs on one free VM (Oracle Always Free 2 OCPU / 12 GB is enough).
#   SIGNALS_TOKEN=$(openssl rand -hex 24) docker compose up -d
services:
  languagetool:
    image: erikvl87/languagetool
    restart: unless-stopped
    environment:
      Java_Xms: 512m
      Java_Xmx: 3g
  signals:
    build: .
    restart: unless-stopped
    depends_on: [languagetool]
    environment:
      LT_URL: http://languagetool:8010
      SIGNALS_TOKEN: ${SIGNALS_TOKEN:?set SIGNALS_TOKEN}
    ports:
      - "8080:8080"
